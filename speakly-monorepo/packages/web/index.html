<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speakly Web</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Import map: пакет @speakly/core підключається за іменем, як і в Node.js -->
    <script type="importmap">
        {
          "imports": {
            "@speakly/core": "/node_modules/@speakly/core/index.js"
          }
        }
    </script>
</head>
<body>
<header class="header">
    <h1>Speakly Web</h1>
    <p>Веб-версія застосунку для вивчення іноземних мов на спільному ядрі @speakly/core</p>
</header>

<main class="container">
    <section class="card">
        <h2>Додати слово для вивчення</h2>
        <input type="text" id="wordInput" class="word-input" placeholder="Введіть слово" />
        <button id="addWordButton" class="button">Додати слово</button>
        <p id="message" class="message"></p>
    </section>

    <section class="card">
        <h2>Словник слів</h2>
        <input type="search" id="searchInput" class="word-input" placeholder="Пошук за словом" />
        <ul id="wordsList" class="words-list"></ul>
    </section>
</main>

<script type="module" src="script.js"></script>
</body>
</html>
